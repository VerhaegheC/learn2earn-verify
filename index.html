<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6EFDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learn2Earn">
<title>Learn2Earn — voucher controleren</title>
<style>
  :root { --bg:#F6EFDF; --card:#FFFFFF; --sand:#E3D6BD; --terra:#C56A33; --blue:#6C9AB4; --blue-dark:#5B87A0;
          --amber:#E8B04B; --danger:#B03A2A; --text:#3E2F26; --muted:#8B7C6E; --faint:#BCAE97; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); text-align:center;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:420px; margin:0 auto; padding:48px 22px 36px; min-height:100vh; display:flex; flex-direction:column; }
  .badge { width:96px; height:96px; border-radius:48px; margin:0 auto 20px; color:var(--bg); font-size:52px; line-height:96px; font-weight:700; }
  .badge.ok{background:var(--blue)} .badge.warn{background:var(--amber)} .badge.bad{background:var(--danger)} .badge.muted{background:var(--faint)}
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:32px; font-weight:600; color:var(--terra); margin:0 0 16px; line-height:1.2 }
  h1.bad { color:var(--danger) }
  .card { border:1.5px solid var(--sand); border-radius:22px; padding:20px 18px; margin:0 0 18px; background:transparent }
  .card p { margin:0 0 6px; font-size:17px; line-height:1.55 } .card p:last-child{margin-bottom:0}
  .small { font-size:14px; color:var(--muted) } .strong { font-family:Georgia,serif; font-size:22px; font-weight:700 }
  .alert { color:var(--danger) }
  .btn { display:block; width:100%; border:0; border-radius:999px; padding:16px; font-size:16px; font-weight:700; letter-spacing:.5px;
         background:var(--terra); color:var(--bg); cursor:pointer; margin-top:10px }
  .btn.secondary { background:transparent; color:var(--terra); border:1.5px solid var(--terra) }
  .btn:active { opacity:.85 }
  .foot { font-size:13px; color:var(--muted); line-height:1.6; margin-top:14px }
  .brand { margin-top:auto; padding-top:30px; font-size:12px; color:var(--faint); letter-spacing:2px; text-transform:uppercase }
  .pill { display:inline-block; background:rgba(108,154,180,.16); color:var(--blue-dark); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600; margin-bottom:16px }
  /* scanner */
  .scan { position:relative; width:100%; aspect-ratio:1; border-radius:22px; overflow:hidden; background:#000; margin:0 0 16px }
  .scan video { width:100%; height:100%; object-fit:cover }
  .scan .frame { position:absolute; inset:14%; border:3px solid rgba(246,239,223,.9); border-radius:18px; pointer-events:none }
  .hidden { display:none }
</style>
</head>
<body>
<main id="app"><div class="badge muted">…</div><h1>Even geduld</h1></main>

<script>
const API = "https://angweuurnozgefzboxvv.supabase.co/functions/v1/verify";
const KEY = "l2e_partner";
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = (iso) => iso ? new Intl.DateTimeFormat("nl-BE", { timeZone:"Europe/Brussels", hour:"2-digit", minute:"2-digit" }).format(new Date(iso)) : "";
const getKey = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
const setKey = (k) => { try { localStorage.setItem(KEY, k); } catch {} };
const pairedName = () => { try { return localStorage.getItem(KEY + "_name"); } catch { return null; } };

function render({ tone, title, lines = [], buttons = [], foot = "" , pill = ""}) {
  const icon = { ok:"&#10003;", warn:"!", bad:"&#10005;", muted:"&#8226;" }[tone];
  app.innerHTML = `
    ${pill ? `<div class="pill">${pill}</div>` : ""}
    <div class="badge ${tone}">${icon}</div>
    <h1 class="${tone === "bad" ? "bad" : ""}">${esc(title)}</h1>
    ${lines.length ? `<div class="card">${lines.map((l) => `<p>${l}</p>`).join("")}</div>` : ""}
    <div id="buttons"></div>
    ${foot ? `<div class="foot">${foot}</div>` : ""}
    <div class="brand">Learn2Earn</div>`;
  const box = document.getElementById("buttons");
  for (const b of buttons) {
    const el = document.createElement("button");
    el.className = "btn" + (b.secondary ? " secondary" : "");
    el.textContent = b.label;
    el.onclick = b.onClick;
    box.appendChild(el);
  }
}

async function api(params, key) {
  const headers = key ? { "x-partner-key": key } : {};
  const res = await fetch(API + "?" + new URLSearchParams(params), { headers, cache: "no-store" });
  return res.json();
}

// ── Voucher-resultaat tonen ───────────────────────────────────────
function showResult(r, afterButtons) {
  const who = `${esc(r.studentName)} · ${esc(r.restaurant?.name)}`;
  const desc = `<span class="strong">${esc(r.description)}</span>`;
  const age = r.usedAt
    ? (r.minutesAgo >= 30
        ? `<span class="small alert">Let op: al ${r.minutesAgo} minuten geleden ingewisseld.</span>`
        : `<span class="small">Ingewisseld om ${fmtTime(r.usedAt)} (${r.minutesAgo === 0 ? "zonet" : r.minutesAgo + " min geleden"})</span>`)
    : "";
  const map = {
    invalid:           { tone:"bad",   title:"Ongeldig",             lines:["Deze QR-code hoort niet bij een voucher."] },
    not_redeemed:      { tone:"warn",  title:"Nog niet ingewisseld", lines:[desc, who, '<span class="small">De student moet eerst vegen in de app.</span>'] },
    confirmed:         { tone:"ok",    title:"Geldig",               lines:[desc, who, age, `<span class="small">Bevestigd door jullie om ${fmtTime(r.verifiedAt)}</span>`],
                         foot:"Geef de korting. Deze voucher kan niet opnieuw gebruikt worden." },
    already_confirmed: { tone:"muted", title:"Al bevestigd",         lines:[desc, who, age, `<span class="small">Eerder al bevestigd om ${fmtTime(r.verifiedAt)}</span>`],
                         foot:"Deze voucher werd al eerder gescand en bevestigd." },
    wrong_restaurant:  { tone:"warn",  title:"Verkeerd restaurant",  lines:[`Deze voucher is voor <span class="strong">${esc(r.restaurant?.name)}</span>`, `<span class="small">Jouw gsm is gekoppeld aan ${esc(r.scannerRestaurant?.name)}.</span>`] },
    unpaired:          { tone:"muted", title:"Ingewisseld",          lines:[desc, who, age,
                           r.verifiedAt ? `<span class="small">Bevestigd door het restaurant om ${fmtTime(r.verifiedAt)}</span>`
                                        : '<span class="small">Niet bevestigd als restaurant — deze gsm is niet gekoppeld.</span>'],
                         foot:"Personeel: open de partnerlink van Learn2Earn om je gsm te koppelen." },
  };
  const view = map[r.status] ?? map.invalid;
  render({ ...view, buttons: afterButtons, pill: pairedName() ? "Gekoppeld: " + esc(pairedName()) : "" });
}

// ── Ingebouwde scanner (voor de partnerpagina) ───────────────────
let stream = null;
function stopScanner() { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } }

async function startScanner(key) {
  render({ tone:"ok", title:"Scan de voucher", lines:[], pill: "Gekoppeld: " + esc(pairedName() || "") });
  const box = document.createElement("div");
  box.className = "scan";
  box.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div>`;
  app.insertBefore(box, document.getElementById("buttons"));
  const video = box.querySelector("video");
  const hint = document.createElement("div");
  hint.className = "foot";
  hint.textContent = "Richt de camera op het scherm van de student.";
  app.insertBefore(hint, document.getElementById("buttons"));

  if (!window.jsQR) {
    await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = ok; s.onerror = bad; document.head.appendChild(s); })
      .catch(() => render({ tone:"bad", title:"Scanner niet geladen", lines:["Controleer je internet en probeer opnieuw."], buttons:[{ label:"Opnieuw", onClick:() => startScanner(key) }] }));
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch {
    return render({ tone:"bad", title:"Geen camera-toegang", lines:["Sta camera-toegang toe in je browser en probeer opnieuw."], buttons:[{ label:"Opnieuw", onClick:() => startScanner(key) }] });
  }
  video.srcObject = stream;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const tick = () => {
    if (!stream) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR && window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
      if (code && code.data) {
        let token = null;
        try { token = new URL(code.data).searchParams.get("t"); } catch {}
        if (token) {
          stopScanner();
          render({ tone:"muted", title:"Controleren…", pill: "Gekoppeld: " + esc(pairedName() || "") });
          api({ t: token }, key).then((r) => showResult(r, [{ label:"Volgende scannen", onClick:() => startScanner(key) }]))
            .catch(() => render({ tone:"bad", title:"Geen verbinding", lines:["Controleer je internet."], buttons:[{ label:"Opnieuw", onClick:() => startScanner(key) }] }));
          return;
        }
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ── Start ─────────────────────────────────────────────────────────
(async () => {
  const q = new URLSearchParams(location.search);
  const partner = q.get("partner");
  const token = q.get("t");

  if (partner) {
    // Partnerlink: koppelen + scanner aanbieden
    let r; try { r = await api({ partner }); } catch { return render({ tone:"bad", title:"Geen verbinding", lines:["Controleer je internet en open de link opnieuw."] }); }
    if (!r.ok) return render({ tone:"bad", title:"Ongeldige partnerlink", lines:["Deze link werkt niet (meer).", '<span class="small">Vraag een nieuwe link aan Learn2Earn.</span>'] });
    setKey(partner); try { localStorage.setItem(KEY + "_name", r.restaurant.name); } catch {}
    return render({
      tone:"ok", title:"Gekoppeld",
      lines:[`Deze gsm is nu gekoppeld aan`, `<span class="strong">${esc(r.restaurant.name)}</span>`,
             '<span class="small">Tip: zet deze pagina op je beginscherm (Delen → Zet op beginscherm). Dan open je hem als een app en scan je meteen.</span>'],
      buttons:[{ label:"Scan een voucher", onClick:() => startScanner(partner) }],
      foot:"Je kan ook de gewone camera-app gebruiken: scans op deze gsm tellen als bevestiging door jullie.",
    });
  }

  if (token) {
    // Gescand met de camera-app: resultaat tonen (met koppeling als die er is)
    const key = getKey();
    let r; try { r = await api({ t: token }, key); } catch { return render({ tone:"bad", title:"Geen verbinding", lines:["Controleer je internet."] }); }
    return showResult(r, key ? [{ label:"Volgende scannen", onClick:() => startScanner(key) }] : []);
  }

  // Zonder parameters: gekoppeld → scanner; anders uitleg
  const key = getKey();
  if (key) return startScanner(key);
  render({ tone:"muted", title:"Learn2Earn", lines:["Open de partnerlink die je van Learn2Earn kreeg om je gsm te koppelen.", '<span class="small">Daarna kan je vouchers van studenten scannen en bevestigen.</span>'] });
})();
</script>
</body>
</html>
