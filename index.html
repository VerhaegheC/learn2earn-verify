<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learn2Earn">
<title>Learn2Earn — voucher controleren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
  /* Dezelfde stijl als de app overdag. Altijd licht: dit gebruikt het personeel aan de kassa. */
  :root { --bg:#F4F6F8; --card:#FFFFFF; --line:#C3CCD6; --key:#587FA6; --key-edge:#3F6488; --ok:#A7C4A0; --warn:#F2CF7A;
          --bad:#D98978; --mist:#E3E9F0; --ink:#1F2937; --soft:#5B6675; --accent:#3F6488; --alert:#A0422F;
          --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); text-align:center;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:420px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 28px); min-height:100vh; display:flex; flex-direction:column; }
  .logo { display:block; width:150px; height:auto; margin:0 auto 18px }
  .kip { display:block; width:128px; height:auto; margin:4px auto 12px }
  /* De uitkomst: één groot vlak, in één oogopslag leesbaar */
  .status { border-radius:24px; padding:26px 18px 24px; margin:0 0 20px; box-shadow:0 0 0 2px var(--ink), 4px 4px 0 2px var(--ink) }
  .status.ok{background:var(--ok)} .status.warn{background:var(--warn)} .status.bad{background:var(--bad)} .status.muted{background:var(--mist)}
  .icon { width:64px; height:64px; margin:0 auto 12px; border-radius:50%; background:#FFFFFF; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px var(--ink) }
  .icon svg { width:36px; height:36px }
  h1 { font-family:var(--display); font-weight:700; font-size:40px; letter-spacing:-1.4px; line-height:1.08; margin:0 }
  h1.plain { font-size:34px; margin:0 0 16px }
  .say { margin-top:8px; font-size:18px; font-weight:800 }
  .card { background:var(--card); border-radius:20px; padding:18px 16px; margin:0 0 20px; box-shadow:0 0 0 1.5px var(--line), 3px 3px 0 1.5px var(--line) }
  .card p { margin:0 0 6px; font-size:16px; line-height:1.5 } .card p:last-child{margin-bottom:0} .card p:empty{display:none}
  .small { font-size:14px; color:var(--soft) } .strong { font-family:var(--display); font-weight:700; font-size:24px; letter-spacing:-.6px; color:var(--ink) }
  .alert { color:var(--alert); font-weight:700 }
  .btn { display:block; width:100%; border:0; border-radius:999px; padding:16px; font-family:var(--display); font-size:17px; font-weight:700;
         background:var(--key); color:#FFFFFF; cursor:pointer; margin-top:12px; box-shadow:0 0 0 1.5px var(--key-edge), 3px 3px 0 1.5px var(--key-edge) }
  .btn:active { transform:translate(3px,3px); box-shadow:0 0 0 1.5px var(--key-edge) }
  .btn.secondary { background:var(--card); color:var(--ink); box-shadow:0 0 0 1.5px var(--line), 3px 3px 0 1.5px var(--line) }
  .foot { font-size:14px; color:var(--soft); line-height:1.55; margin-top:14px }
  .pill { align-self:center; display:inline-block; background:var(--mist); color:var(--accent); border-radius:999px; padding:6px 14px; font-size:13px; font-weight:700; margin-bottom:16px }
  /* scanner */
  .scan { position:relative; width:100%; aspect-ratio:1; border-radius:24px; overflow:hidden; background:#111827; margin:0 0 14px; box-shadow:0 0 0 2px var(--ink), 4px 4px 0 2px var(--ink) }
  .scan video { width:100%; height:100%; object-fit:cover; display:block }
  .scan .frame { position:absolute; inset:14%; border:3px solid var(--warn); border-radius:20px; pointer-events:none }
  .hidden { display:none }
</style>
</head>

const API = "https://angweuurnozgefzboxvv.supabase.co/functions/v1/verify";
const KEY = "l2e_partner";
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = (iso) => iso ? new Intl.DateTimeFormat("nl-BE", { timeZone:"Europe/Brussels", hour:"2-digit", minute:"2-digit" }).format(new Date(iso)) : "";
const getKey = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
const setKey = (k) => { try { localStorage.setItem(KEY, k); } catch {} };
const pairedName = () => { try { return localStorage.getItem(KEY + "_name"); } catch { return null; } };

const ICONS = {
  ok: '<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"/>',
  warn: '<path d="M12 5v9" stroke-width="3"/><path d="M12 18.5v.5" stroke-width="3.4"/>',
  bad: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke-width="3"/>',
  muted: '<path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="4"/>',
};

function render({ tone, title, say = "", lines = [], buttons = [], foot = "" , pill = "", chick = false}) {
  // tone "plain" = enkel een titel, zonder gekleurd vlak (bv. boven de scanner)
  const head = tone === "plain"
    ? `<h1 class="plain">${esc(title)}</h1>`
    : `<div class="status ${tone}"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#1F2937" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[tone]}</svg></div><h1>${esc(title)}</h1>${say ? `<div class="say">${esc(say)}</div>` : ""}</div>`;
  app.innerHTML = `
    <img class="logo" src="${LOGO}" alt="Learn2Earn">
    ${pill ? `<div class="pill">${pill}</div>` : ""}
    ${chick ? `<img class="kip" src="${KIP}" alt="">` : ""}
    ${head}
    ${lines.length ? `<div class="card">${lines.map((l) => `<p>${l}</p>`).join("")}</div>` : ""}
    <div id="buttons"></div>
    ${foot ? `<div class="foot">${foot}</div>` : ""}`;
  const box = document.getElementById("buttons");
  for (const b of buttons) {
    const el = document.createElement("button");
    el.className = "btn" + (b.secondary ? " secondary" : "");
    el.textContent = b.label;
    el.onclick = b.onClick;
    box.appendChild(el);
  }
}

async function api(params, key) {
  const headers = key ? { "x-partner-key": key } : {};
  const res = await fetch(API + "?" + new URLSearchParams(params), { headers, cache: "no-store" });
  return res.json();
}

// ── Voucher-resultaat tonen ───────────────────────────────────────
function showResult(r, afterButtons) {
  const who = `${esc(r.studentName)} · ${esc(r.restaurant?.name)}`;
  const desc = `<span class="strong">${esc(r.description)}</span>`;
  const old = r.usedAt && r.minutesAgo >= 30
    ? `<span class="small alert">Let op: al ${r.minutesAgo} minuten geleden ingewisseld.</span>`
    : "";
  // Voor het personeel zijn er drie uitkomsten: geldig, al gescand, of geen geldige code.
  const notValid = (reason) => ({ tone:"bad", title:"Geen geldige code", lines:[reason], say:"Geef geen korting." });
  const map = {
    invalid:           notValid("Deze QR-code hoort niet bij een voucher."),
    not_redeemed:      notValid("Deze voucher is nog niet ingewisseld in de app."),
    wrong_restaurant:  notValid(`Deze voucher is voor <span class="strong">${esc(r.restaurant?.name)}</span>`),
    confirmed:         { tone:"ok",   title:"Geldig",     lines:[desc, who, old], say:"Geef de korting." },
    already_confirmed: { tone:"warn", title:"Al gescand", lines:[desc, who, `<span class="small">Bevestigd om ${fmtTime(r.verifiedAt)}</span>`], say:"Geef geen korting meer." },
    // Geen uitkomst aan de kassa: deze gsm hoort bij geen enkele zaak, dus er wordt niets bevestigd.
    unpaired:          { tone:"muted", title:"Gsm niet gekoppeld", lines:["Deze scan telt niet als bevestiging."], foot:"Personeel: open de partnerlink van Learn2Earn om je gsm te koppelen." },
  };
  const view = map[r.status] ?? map.invalid;
  render({ ...view, buttons: afterButtons, pill: pairedName() ? "Gekoppeld: " + esc(pairedName()) : "" });
}

// ── Ingebouwde scanner (voor de partnerpagina) ───────────────────
let stream = null;
function stopScanner() { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } }

async function startScanner(key) {
  render({ tone:"plain", title:"Scan de voucher", lines:[], pill: "Gekoppeld: " + esc(pairedName() || "") });
  const box = document.createElement("div");
  box.className = "scan";
  box.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div>`;
  app.insertBefore(box, document.getElementById("buttons"));
  const video = box.querySelector("video");
  const hint = document.createElement("div");
  hint.className = "foot";
  hint.textContent = "Richt de camera op het scherm van de student.";
  app.insertBefore(hint, document.getElementById("buttons"));

  if (!window.jsQR) {
    await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; s.onload = ok; s.onerror = bad; document.head.appendChild(s); })
      .catch(() => render({ tone:"bad", title:"Scanner niet geladen", lines:["Controleer je internet en probeer opnieuw."], buttons:[{ label:"Opnieuw", onClick:() => startScanner(key) }] }));
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch {
    return render({ tone:"bad", title:"Geen camera-toegang", lines:["Sta camera-toegang toe in je browser en probeer opnieuw."], buttons:[{ label:"Opnieuw", onClick:() => startScanner(key) }] });
  }
  video.srcObject = stream;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const tick = () => {
    if (!stream) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR && window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
      if (code && code.data) {
        let token = null;
        try { token = new URL(code.data).searchParams.get("t"); } catch {}
        if (token) {
          stopScanner();
          render({ tone:"muted", title:"Controleren…", pill: "Gekoppeld: " + esc(pairedName() || "") });
          api({ t: token }, key).then((r) => showResult(r, [{ label:"Volgende scannen", onClick:() => startScanner(key) }]))
            .catch(() => render({ tone:"bad", title:"Geen verbinding", lines:["Controleer je internet."], buttons:[{ label:"Opnieuw", onClick:() => startScanner(key) }] }));
          return;
        }
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ── Start ─────────────────────────────────────────────────────────
(async () => {
  const q = new URLSearchParams(location.search);
  const partner = q.get("partner");
  const token = q.get("t");

  if (partner) {
    // Partnerlink: koppelen + scanner aanbieden
    let r; try { r = await api({ partner }); } catch { return render({ tone:"bad", title:"Geen verbinding", lines:["Controleer je internet en open de link opnieuw."] }); }
    if (!r.ok) return render({ tone:"bad", title:"Ongeldige partnerlink", lines:["Deze link werkt niet (meer).", '<span class="small">Vraag een nieuwe link aan Learn2Earn.</span>'] });
    setKey(partner); try { localStorage.setItem(KEY + "_name", r.restaurant.name); } catch {}
    return render({
      tone:"ok", title:"Gekoppeld", chick:true,
      lines:[`Deze gsm is nu gekoppeld aan`, `<span class="strong">${esc(r.restaurant.name)}</span>`,
             '<span class="small">Tip: zet deze pagina op je beginscherm (Delen → Zet op beginscherm). Dan open je hem als een app en scan je meteen.</span>'],
      buttons:[{ label:"Scan een voucher", onClick:() => startScanner(partner) }],
      foot:"Je kan ook de gewone camera-app gebruiken: scans op deze gsm tellen als bevestiging door jullie.",
    });
  }

  if (token) {
    // Gescand met de camera-app: resultaat tonen (met koppeling als die er is)
    const key = getKey();
    let r; try { r = await api({ t: token }, key); } catch { return render({ tone:"bad", title:"Geen verbinding", lines:["Controleer je internet."] }); }
    return showResult(r, key ? [{ label:"Volgende scannen", onClick:() => startScanner(key) }] : []);
  }

  // Zonder parameters: gekoppeld → scanner; anders uitleg
  const key = getKey();
  if (key) return startScanner(key);
  render({ tone:"plain", title:"Hier controleer je vouchers", chick:true, lines:["Open de partnerlink die je van Learn2Earn kreeg om je gsm te koppelen.", '<span class="small">Daarna kan je vouchers van studenten scannen en bevestigen.</span>'] });
})();
</script>
